		<div style="position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0;">
            <iframe id="bgMusic" width="10" height="10" src="https://www.youtube.com/embed/5hfbD2j5Re0?autoplay=1&loop=1&playlist=5hfbD2j5Re0" frameborder="0" allow="autoplay"></iframe>
        </div>
        <script>
            let hasInteracted = false;
            document.body.addEventListener('pointerdown', () => {
                if (!hasInteracted) {
                    hasInteracted = true;
                    // Trigger iframe reload to bypass autoplay restriction upon first interaction
                    let iframe = document.getElementById('bgMusic');
                    let src = iframe.src;
                    iframe.src = src;
                }
            });
        </script>
