<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prajna</title>
    <link id="favicon" rel="icon" type="image/png" href="">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Video container fits to Chrome window perfectly */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Disable interaction with youtube iframe to hide UI completely */
            z-index: 1;
        }

        .video-background iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Interaction layer sitting on top */
        #interaction-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #instruction {
            color: rgba(255, 255, 255, 0.7);
            font-family: sans-serif;
            font-size: 1.2rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            transition: opacity 1s;
        }
    </style>
</head>
<body>
    
    <div class="video-background">
        <div id="player"></div>
    </div>
    
    <div id="interaction-layer">
        <div id="instruction">Chạm để Phát/Dừng<br>Chạm đúp trái: Bài trước<br>Chạm đúp phải: Bài sau</div>
    </div>
    
    <canvas id="favicon-canvas" width="32" height="32" style="display:none;"></canvas>

    <script>
        // List of video IDs from @tutaisong
        const videoIds = [
            'F_w7TaKtE3I', 'G7d1H-AV5hU', 'JqjRSmJ1ElM', '9Mr-a-Qr76Q', 'dT8GEjZ3j64', 
            'uL1RC-W8DEI', '73y3k_fYgD8', 'QfTHY-ZbA6U', 'wdbvaknGt7o', 'AoGdSgKKeO4', 
            'CJMePffaPAM', '18-ANLjC6so', 'q4BU-EuFjt4', '-GNZpn3nPiY', 'UshU4s3z-_k', 
            'dOE7y7_tVOU', 'H3PWas1_9e0', '8sN7iLOoRxo', 'rOZulWtU8ds', '9v5cN4aqh0o',
            '5hfbD2j5Re0'
        ];

        let playHistory = [];
        let currentIndex = -1;
        let unplayedIds = [...videoIds];
        let player;
        
        // Load YouTube IFrame API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            // Pick initial random song
            let randomIndex = Math.floor(Math.random() * unplayedIds.length);
            let firstId = unplayedIds.splice(randomIndex, 1)[0];
            playHistory.push(firstId);
            currentIndex = 0;

            player = new YT.Player('player', {
                videoId: firstId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'iv_load_policy': 3,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'playsinline': 1,
                    'mute': 0 
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            event.target.setPlaybackQuality('hd1080');
            event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                document.getElementById('instruction').style.opacity = '0';
            }
            if (event.data === YT.PlayerState.ENDED) {
                playNext();
            }
        }
        
        function onPlayerError(event) {
            playNext();
        }

        function playNext() {
            if (currentIndex < playHistory.length - 1) {
                currentIndex++;
                player.loadVideoById({'videoId': playHistory[currentIndex], 'suggestedQuality': 'hd1080'});
            } else {
                if (unplayedIds.length === 0) {
                    unplayedIds = [...videoIds]; // Reset when all played
                }
                let randomIndex = Math.floor(Math.random() * unplayedIds.length);
                let nextId = unplayedIds.splice(randomIndex, 1)[0];
                playHistory.push(nextId);
                currentIndex = playHistory.length - 1;
                player.loadVideoById({'videoId': nextId, 'suggestedQuality': 'hd1080'});
            }
        }

        function playPrevious() {
            if (currentIndex > 0) {
                currentIndex--;
                player.loadVideoById({'videoId': playHistory[currentIndex], 'suggestedQuality': 'hd1080'});
            } else {
                // If at the beginning, just restart the current song
                player.seekTo(0);
            }
        }

        function showInstruction(text) {
            const inst = document.getElementById('instruction');
            inst.innerHTML = text;
            inst.style.opacity = '1';
            setTimeout(() => {
                inst.style.opacity = '0';
            }, 1500);
        }

        // Custom single/double tap logic
        let clickTimer = null;
        document.getElementById('interaction-layer').addEventListener('pointerdown', function(e) {
            // Prevent default to avoid side effects on mobile
            e.preventDefault();
            
            if (e.button && e.button !== 0) return; // Only left click

            if (clickTimer !== null) {
                // Double tap
                clearTimeout(clickTimer);
                clickTimer = null;
                
                let screenWidth = window.innerWidth;
                if (e.clientX < screenWidth / 2) {
                    playPrevious();
                    showInstruction("Bài trước...");
                } else {
                    playNext();
                    showInstruction("Bài tiếp theo...");
                }
            } else {
                // Single tap
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    if (player && typeof player.getPlayerState === 'function') {
                        let state = player.getPlayerState();
                        // If video is not started, play it
                        if (state === YT.PlayerState.UNSTARTED || state === YT.PlayerState.CUED) {
                             player.playVideo();
                             showInstruction("Phát nhạc...");
                        } else if (state === YT.PlayerState.PLAYING) {
                            player.pauseVideo();
                            showInstruction("Tạm dừng");
                        } else {
                            player.playVideo();
                            showInstruction("Phát nhạc");
                        }
                    }
                }, 300);
            }
        });

        // --- Animated Favicon Logic (Dharma Wheel) ---
        let faviconAngle = 0;
        function animateFavicon() {
            const canvas = document.getElementById('favicon-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const cx = width / 2;
            const cy = height / 2;
            const radius = 14;

            ctx.clearRect(0, 0, width, height);

            ctx.translate(cx, cy);
            ctx.rotate(faviconAngle);

            // Bánh Xe (Outer Ring) - Gold/Wood color
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#D4AF37'; // Gold
            ctx.stroke();

            // Tâm Bánh Xe (Inner Hub)
            ctx.beginPath();
            ctx.arc(0, 0, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#D4AF37';
            ctx.fill();

            // 8 Căm (Spokes)
            ctx.lineWidth = 2;
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(radius, 0);
                ctx.stroke();
                ctx.rotate(Math.PI / 4);
            }

            ctx.rotate(-faviconAngle);
            ctx.translate(-cx, -cy);

            faviconAngle += 0.15;

            const link = document.getElementById('favicon');
            if (link) {
                link.href = canvas.toDataURL('image/png');
            }

            setTimeout(animateFavicon, 100);
        }

        window.onload = function() {
            animateFavicon();
        };

    </script>
</body>
</html>
